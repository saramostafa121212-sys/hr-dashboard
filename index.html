html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;transition:background .4s,color .4s}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:22px 24px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#1f2a44,#14919b,#1f2a44);background-size:200% 100%;animation:flow 14s ease-in-out infinite alternate}

button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;transition:transform .15s,box-shadow .2s,background .2s,color .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14)}button:active{transform:scale(.96)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.btns button.on{background:#f28e2b;border-color:#f28e2b}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:16px 0}
.filters label{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--a);margin-bottom:6px}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}
.pills button{padding:5px 12px;font-size:12.5px}.pills button.on{background:var(--a);border-color:var(--a);color:#fff;box-shadow:0 4px 12px rgba(20,145,155,.45)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;animation:up .6s both;animation-delay:calc(var(--i,0)*70ms);transition:transform .25s,box-shadow .25s,background .4s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.14)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.k{border-top:4px solid var(--a)}.k:nth-child(2){border-color:var(--r)}.k:nth-child(3){border-color:var(--c)}.k:nth-child(4){border-color:var(--b)}.k:nth-child(5){border-color:var(--mu)}
.k small{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--mu)}.k b{display:block;font-size:32px;margin:4px 0 0;font-variant-numeric:tabular-nums}.k span{font-size:12px;color:var(--mu)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.chip{border-left:4px solid var(--b);padding:10px 12px;background:var(--card);border-radius:10px;font-size:13px;animation:up .6s both;animation-delay:.4s}.chip b{display:block;font-size:11px;color:var(--mu);letter-spacing:.6px}
.tabs{display:flex;gap:8px;margin:8px 0 14px}.tabs button{padding:9px 20px;font-weight:600}.tabs button.on{background:var(--c);border-color:var(--c);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;animation:up .5s both}.grid[hidden]{display:none}
.card h3{margin:0 0 10px;font-size:14px}.box{position:relative;height:290px}
footer{margin:18px 0 6px;text-align:center;font-size:12px;color:var(--mu)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.chips,.filters{grid-template-columns:1fr 1fr}.filters div:first-child{grid-column:1/-1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

if(CH[s.id]){CH[s.id].data.labels=x.L;CH[s.id].data.datasets=ds;CH[s.id].update();return}
CH[s.id]=new Chart($("#"+s.id),{type:s.ty,data:{labels:x.L,datasets:ds},options:{indexAxis:s.h?"y":"x",maintainAspectRatio:false,cutout:"62%",layout:{padding:{right:s.h?34:4,top:s.h?4:20}},
plugins:{vals:{pct:!!s.p},legend:{display:x.S.length>1||s.ty==="doughnut",position:"bottom",labels:{usePointStyle:true}}},
scales:s.ty==="doughnut"?{}:s.h?{x:{display:false},y:{grid:{display:false}}}:{y:{display:false},x:{grid:{display:false}}}}})})}
function count(el,to,f){const a=el._v||0,t0=performance.now(),d=rm?0:800;el._v=to;(function s(t){const p=d?Math.min(1,(t-t0)/d):1,e=1-Math.pow(1-p,3);el.textContent=f(a+(to-a)*e);if(p<1)requestAnimationFrame(s)})(t0)}
const KP=[["ACTIVE HEADCOUNT",n=>Math.round(n).toLocaleString()],["ATTRITION RATE",n=>n.toFixed(1)+"%"],["AVG MONTHLY SALARY",n=>Math.round(n).toLocaleString()],["AVG TENURE (YEARS)",n=>n.toFixed(1)],["AVG PERFORMANCE",n=>n.toFixed(2)]];
function kpis(){const A=cur.filter(act),Rs=cur.filter(res);
const v=[A.length,cur.length?Rs.length/cur.length*100:0,avg(A.map(r=>r.sal)),avg(A.filter(r=>r.t!=null).map(r=>r.t)),avg(A.filter(r=>r.p).map(r=>r.p))];
const sb=["of "+cur.length+" ever hired",Rs.length+" resigned","EGP per month, active","active staff","scale 1 to 5"];
v.forEach((x,i)=>{count($("#kb"+i),x,KP[i][1]);$("#ks"+i).textContent=sb[i]})}
function ins(){const o=[],dd=DEPTS.map(x=>{const r=cur.filter(q=>q.d===x);return[x,r.length?cnt(r,res)/r.length:0,r.length]}).filter(a=>a[2]>=5).sort((a,b)=>b[1]-a[1])[0];
o.push(["HIGHEST ATTRITION",dd&&dd[1]>0?dd[0]+" at "+Math.round(dd[1]*100)+"%":"No resignations in this view"]);
const rc=REAS.map(x=>[x,cnt(cur,r=>res(r)&&r.r===x)]).sort((a,b)=>b[1]-a[1])[0];o.push(["TOP EXIT REASON",rc&&rc[1]?rc[0]+" ("+rc[1]+" exits)":"No exit reasons here"]);
const m=avg(cur.filter(r=>act(r)&&r.g==="Male").map(r=>r.sal)),f=avg(cur.filter(r=>act(r)&&r.g==="Female").map(r=>r.sal));
o.push(["PAY GAP, WOMEN VS MEN",m&&f?((f/m-1)*100).toFixed(1)+"% (not level-adjusted)":"Not enough data"]);
const hy=YRS.map(y=>[y,cnt(cur,r=>r.hy===y)]).sort((a,b)=>b[1]-a[1])[0];o.push(["PEAK HIRING YEAR",hy&&hy[1]?hy[0]+" with "+hy[1]+" hires":"No hires in this view"]);
$("#ins").innerHTML=o.map(a=>'<div class="chip"><b>'+a[0]+"</b>"+a[1]+"</div>").join("")}
function refresh(){cur=D.filter(r=>(F.d==="All"||r.d===F.d)&&(F.l==="All"||r.l===F.l)&&(F.m==="All"||r.m===F.m));
$("#sub").textContent="Showing "+cur.length+" of "+D.length+" employees  ·  Software company, backend-driven  ·  as of 17 Nov 2026";kpis();ins();build()}
function pills(id,list,key){const el=$(id);el.innerHTML=["All",...list].map(x=>'<button aria-pressed="false">'+x+"</button>").join("");
el.onclick=e=>{if(e.target.tagName!=="BUTTON")return;stopTour();F[key]=e.target.textContent;mark();refresh()}}
function mark(){[["#pd","d"],["#pl","l"],["#pm","m"]].forEach(([id,k])=>$(id).querySelectorAll("button").forEach(b=>{const on=b.textContent===F[k];b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)}))}
function stopTour(){if(tourT){clearInterval(tourT);tourT=null;$("#tour").classList.remove("on");$("#tour").textContent="▶ Auto-tour"}}
function show(t){tab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));document.querySelectorAll(".grid").forEach(g=>g.hidden=g.dataset.t!==t);
requestAnimationFrame(()=>SP.filter(s=>s.tab===t).forEach(s=>{CH[s.id].resize();CH[s.id].reset();CH[s.id].update()}))}
function theme(t){document.documentElement.dataset.theme=t;$("#theme").textContent=t==="dark"?"☀ Light":"☾ Dark";build()}
$("#kp").innerHTML=KP.map((k,i)=>'<div class="card k" style="--i:'+i+'"><small>'+k[0]+'</small><b id="kb'+i+'">0</b><span id="ks'+i+'"></span></div>').join("");
const T={ov:"Overview",at:"Attrition",pp:"Pay & People"};
$("#main").innerHTML=Object.keys(T).map(t=>'<section class="grid" data-t="'+t+'"'+(t==="ov"?"":" hidden")+">"+SP.filter(s=>s.tab===t).map((s,i)=>'<div class="card" style="--i:'+i+'"><h3>'+s.t+'</h3><div class="box"><canvas id="'+s.id+'"></canvas></div></div>').join("")+"</section>").join("");
pills("#pd",DEPTS,"d");pills("#pl",LV,"l");pills("#pm",MD,"m");
document.querySelector(".tabs").onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
$("#reset").onclick=()=>{stopTour();F={d:"All",l:"All",m:"All"};mark();refresh()};
$("#replay").onclick=()=>{kpis();SP.filter(s=>s.tab===tab).forEach(s=>{CH[s.id].reset();CH[s.id].update()})};
$("#theme").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#tour").onclick=()=>{if(tourT)return stopTour();$("#tour").classList.add("on");$("#tour").textContent="⏸ Stop tour";let i=0;const L=["All",...DEPTS];
tourT=setInterval(()=>{F.d=L[++i%L.length];mark();refresh()},2600)};
theme(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");mark();refresh();
</script></body></html>
